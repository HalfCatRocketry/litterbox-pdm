# Runs the full test suite on every push to a branch, and for the release workflow (which calls this before it
# builds anything, so a tag push runs the tests once, there). It runs on Linux because the Git LFS tests use a
# stand-in git-lfs script that needs a Unix-like system (on Windows those tests are skipped).

name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the tests
        # One process: on a two-core runner, tools/run_tests.py (a process per test class) was slower than this
        # (about 420 s against 340 s). Public repositories get bigger runners, so it may be worth trying again.
        working-directory: app
        env:
          PYTHONPATH: "."
        run: python -m unittest discover -s tests -t . -p "test_*.py"

      - name: Run the SolidWorks tool tests
        working-directory: tools/solidworks
        env:
          PYTHONPATH: ".:../../app"
        run: python -m unittest discover -s tests -p "test_*.py"
