# Builds the installer and publishes a release.
#
#   Release:     push a tag like v0.1.0, or v0.7.0-beta.1 for a beta (docs/RELEASING.md has the steps). The tag must
#                match VERSION in app/litterbox/version.py.
#   Test build:  Actions tab -> "Release" -> Run workflow. Builds everything and attaches the installer to the run
#                (download it from the run's page); signs and publishes nothing.
#
# Two jobs, so the signing key is only ever where it is needed:
#   build    (Windows) the tests, the program, the installer. It has no secrets: it installs other people's packages
#            and runs every test, and none of that should be able to read the key. It is told the PUBLIC key
#            (the repository variable LITTERBOX_PUBLIC_KEY), which isn't secret.
#   publish  (Linux) signs latest.json with the private key and publishes the release. It runs only for a tag, in the
#            "release" environment, whose secret LITTERBOX_SIGNING_KEY only v* tags can use; it installs only the
#            pinned cryptography package.
# Packages are installed from hash-pinned lists (packaging/requirements-build.txt, requirements-sign.txt), so a
# changed or replaced package on PyPI stops the run instead of going into a release.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The full test suite (tests.yml). A failing test here stops the release.
  test:
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.installer.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements-build.txt

      - name: Install dependencies (pinned, with hashes)
        run: python -m pip install --require-hashes -r packaging/requirements-build.txt

      - name: The tag matches app/litterbox/version.py
        if: startsWith(github.ref, 'refs/tags/v')
        run: python packaging/check_version.py ${{ github.ref_name }}

      - name: Run the tests on Windows too
        # Many tests are skipped on Windows (the git tests need the Linux job), but the rest catch Windows-only
        # problems, such as how paths and line endings behave. A failure stops the release, as on Linux.
        working-directory: app
        env:
          PYTHONPATH: "."
        run: python -m unittest discover -s tests -t . -p "test_*.py"

      - name: Tell the program where its updates come from
        run: python packaging/write_build_info.py --repo ${{ github.repository }} --public-key "${{ vars.LITTERBOX_PUBLIC_KEY }}"

      - name: Build the program
        run: pyinstaller packaging/litterbox.spec --noconfirm --distpath dist --workpath build

      - name: Check the built program (opens no window)
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process -FilePath "dist\Litterbox\Litterbox.exe" -ArgumentList @("--self-test", $result) -Wait -PassThru
          if (Test-Path $result) { Get-Content $result } else { Write-Host "The program wrote no result." }
          if ($p.ExitCode -ne 0) { throw "The built program failed its self-test." }

      - name: Build the installer
        id: installer
        shell: pwsh
        run: |
          choco install innosetup --version 6.7.1 -y --no-progress
          $v = (python packaging/check_version.py --print).Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed." }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Keep the installer with this run
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: dist/installer/*.exe

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements-sign.txt

      - name: Install the signing package (pinned, with hashes)
        run: python -m pip install --require-hashes -r packaging/requirements-sign.txt

      - uses: actions/download-artifact@v8
        with:
          name: installer
          path: dist/installer

      - name: Sign the update information
        env:
          LITTERBOX_SIGNING_KEY: ${{ secrets.LITTERBOX_SIGNING_KEY }}
        run: >
          python packaging/make_manifest.py --version "$VERSION" --repo "$GH_REPO"
          --installer "dist/installer/Litterbox-Setup-$VERSION.exe" --out dist/release
          --public-key "${{ vars.LITTERBOX_PUBLIC_KEY }}"

      - name: Publish the release
        run: |
          files=("dist/installer/Litterbox-Setup-$VERSION.exe" dist/release/latest.json dist/release/latest.json.sig)
          if [ -f dist/release/notices.json ]; then
            files+=(dist/release/notices.json dist/release/notices.json.sig)
          fi
          if [[ "$VERSION" == *-beta.* ]]; then
            # A pre-release, so GitHub's "latest" (what everyone else's copy reads) stays the newest real release.
            gh release create "${{ github.ref_name }}" "${files[@]}" --prerelease \
              --title "Litterbox $VERSION (beta)" --notes-file dist/release/notes.md
            # The beta channel: one pre-release whose latest.json is always the newest beta's.
            if ! gh release view beta-channel > /dev/null 2>&1; then
              gh release create beta-channel --prerelease --title "Beta channel" \
                --notes "Where copies with Help > Get beta versions look for the newest beta. Nothing to download here: each beta has a release of its own."
            fi
            gh release upload beta-channel dist/release/latest.json dist/release/latest.json.sig --clobber
          else
            gh release create "${{ github.ref_name }}" "${files[@]}" --latest \
              --title "Litterbox $VERSION" --notes-file dist/release/notes.md
          fi
